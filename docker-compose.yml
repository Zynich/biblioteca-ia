services:
  books_api:
    build: ./services/books_api
    container_name: biblioteca-ia-books-api
    ports:
      - "8001:8000"
    volumes:
      - books_data:/app/data
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  chatbot:
    build: ./services/chatbot
    container_name: biblioteca-ia-chatbot
    ports:
      - "8002:8000"
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  semantic_search:
    build: ./services/semantic_search
    container_name: biblioteca-ia-semantic-search
    ports:
      - "8003:8000"
    volumes:
      - search_index:/app/index
      - hf_cache:/app/.cache/huggingface
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # LLM local opcional (profile local-llm): `make up-local`. Não sobe no `make up` padrão.
  ollama:
    image: ollama/ollama:latest
    container_name: biblioteca-ia-ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  books_data:
  search_index:
  hf_cache:
